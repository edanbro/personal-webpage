<header class="relative border-b transition-colors duration-300"
  [class]="scrolled || menuOpen
    ? 'border-zinc-200/80 bg-white/80 backdrop-blur-md dark:border-zinc-800/80 dark:bg-zinc-950/80'
    : 'border-transparent'">
  <nav class="container-page flex h-16 items-center justify-between gap-4" aria-label="Main">
    <a href="#top" class="flex items-center gap-2.5 rounded-lg font-semibold tracking-tight" (click)="closeMenu()">
      <span class="grid h-8 w-8 place-items-center rounded-lg bg-brand-700 font-mono text-xs font-bold text-white dark:bg-brand-400 dark:text-zinc-950">EB</span>
      <span class="text-sm">Eduard Broasca</span>
    </a>

    <ul class="hidden items-center gap-1 md:flex">
      @for (link of links; track link.id) {
        <li>
          <a [href]="'#' + link.id"
            [attr.aria-current]="activeSection === link.id ? 'true' : null"
            class="rounded-md px-3 py-2 text-sm transition-colors"
            [class]="activeSection === link.id
              ? 'text-zinc-900 dark:text-white'
              : 'text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-white'">
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <div class="flex items-center gap-1.5">
      <a [href]="cv" target="_blank" rel="noopener" class="btn-secondary hidden !py-1.5 sm:inline-flex">
        CV
        <app-icon name="arrow-up-right" class="h-3.5 w-3.5" />
      </a>

      <button type="button" class="icon-btn" (click)="toggleTheme()"
        [attr.aria-label]="isDark ? 'Switch to light theme' : 'Switch to dark theme'">
        <app-icon [name]="isDark ? 'sun' : 'moon'" class="h-[18px] w-[18px]" />
      </button>

      <button type="button" class="icon-btn md:hidden" (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen" aria-controls="mobile-menu"
        [attr.aria-label]="menuOpen ? 'Close menu' : 'Open menu'">
        <app-icon [name]="menuOpen ? 'x' : 'menu'" class="h-5 w-5" />
      </button>
    </div>
  </nav>

  @if (menuOpen) {
    <!-- Overlays the page rather than pushing it down, so closing it doesn't shift the section being scrolled to. -->
    <div id="mobile-menu"
      class="absolute inset-x-0 top-full border-b border-zinc-200 bg-white shadow-lg shadow-zinc-900/5 md:hidden dark:border-zinc-800 dark:bg-zinc-950 dark:shadow-black/40">
      <ul class="container-page flex flex-col gap-1 py-4">
        @for (link of links; track link.id) {
          <li>
            <a [href]="'#' + link.id" (click)="closeMenu()"
              class="block rounded-lg px-3 py-2.5 text-base font-medium text-zinc-700 hover:bg-zinc-100 dark:text-zinc-200 dark:hover:bg-zinc-800">
              {{ link.label }}
            </a>
          </li>
        }
        <li class="mt-2 px-3">
          <a [href]="cv" target="_blank" rel="noopener" class="btn-secondary w-full">
            View CV
            <app-icon name="arrow-up-right" class="h-4 w-4" />
          </a>
        </li>
      </ul>
    </div>
  }
</header>
